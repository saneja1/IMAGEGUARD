{% extends "base.html" %}

{% block title %}Dashboard - ImageGuard{% endblock %}

{% block extra_css %}
<style>
    .dashboard-header {
        padding: 2rem 0 1rem 0;
    }
    
    .dashboard-header h2 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
        color: #1e293b;
    }
    
    .dashboard-header p {
        color: #64748b;
        font-size: 1rem;
    }
    
    .search-bar {
        margin: 2rem 0;
        position: relative;
    }
    
    .search-bar input {
        width: 100%;
        padding: 0.75rem 1rem 0.75rem 2.5rem;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
        background: white;
    }
    
    .search-bar input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .search-icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
    }
    
    .images-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.5rem;
        margin-top: 2rem;
    }
    
    .image-card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 1.5rem;
        color: #1e293b;
        transition: transform 0.2s, box-shadow 0.2s;
        cursor: pointer;
        position: relative;
    }
    
    .image-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border-color: #cbd5e1;
    }
    
    .image-card-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
    }
    
    .image-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        gap: 0.25rem;
    }
    
    .ubuntu-icon {
        width: 24px;
        height: 24px;
        background: #E95420;
        border-radius: 50%;
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    
    .ubuntu-icon::before,
    .ubuntu-icon::after {
        content: '';
        position: absolute;
        background: white;
        border-radius: 50%;
    }
    
    .ubuntu-icon::before {
        width: 4px;
        height: 4px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    
    .ubuntu-icon::after {
        width: 3px;
        height: 3px;
        top: 3px;
        right: 3px;
    }
    
    .ubuntu-icon span {
        position: absolute;
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
    }
    
    .ubuntu-icon span:nth-child(1) {
        bottom: 3px;
        right: 3px;
    }
    
    .ubuntu-icon span:nth-child(2) {
        bottom: 3px;
        left: 3px;
    }
    
    .image-name {
        font-size: 1.25rem;
        font-weight: 600;
        color: #1e293b;
    }
    
    .image-meta {
        font-size: 0.875rem;
        color: #64748b;
        margin-bottom: 0.5rem;
    }
    
    .image-tag {
        font-size: 0.875rem;
        color: #64748b;
    }
    
    .free-badge {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: #10b981;
        color: white;
        padding: 0.25rem 0.75rem;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
    }
    
    .verified-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        color: #10b981;
        font-size: 0.875rem;
    }
    
    .no-images {
        text-align: center;
        padding: 4rem 2rem;
        color: #64748b;
        grid-column: 1 / -1;
    }
    
    .no-images-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
    }
    
    .loading {
        text-align: center;
        padding: 4rem 2rem;
        color: #64748b;
        grid-column: 1 / -1;
    }
</style>
{% endblock %}

{% block content %}
<div class="container" style="max-width: 1400px; margin: 0 auto; padding: 0 2rem;">
    <div class="dashboard-header">
        <h2>Certified Images</h2>
        <p>Production-ready, security-scanned container images</p>
    </div>
    
    <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search certified images..." onkeyup="filterImages()">
    </div>
    
    <div id="imagesGrid" class="images-grid">
        <div class="loading">
            <div style="font-size: 2rem;">⏳</div>
            <p>Loading certified images...</p>
        </div>
    </div>
</div>

<script>
let allImages = [];

async function loadCertifiedImages() {
    try {
        const response = await fetch('/api/certified-images-grouped');
        allImages = await response.json();
        displayImages(allImages);
    } catch (error) {
        console.error('Error loading images:', error);
        document.getElementById('imagesGrid').innerHTML = `
            <div class="no-images">
                <div class="no-images-icon">❌</div>
                <h3>Error loading images</h3>
                <p>Could not fetch certified images from registry</p>
            </div>
        `;
    }
}

function displayImages(images) {
    const grid = document.getElementById('imagesGrid');
    
    if (images.length === 0) {
        grid.innerHTML = `
            <div class="no-images">
                <div class="no-images-icon">📦</div>
                <h3>No certified images yet</h3>
                <p>Build and sync images to see them here</p>
            </div>
        `;
        return;
    }
    
    grid.innerHTML = images.map(img => {
        const lastChanged = 'Recently';
        const tags = getImageTags(img.name);
        
        return `
            <div class="image-card" onclick="viewImageDetails('${img.name}')">
                <div class="image-card-header">
                    <div>
                        <div class="image-name">${img.name}</div>
                        ${tags.length > 0 ? `<div style="margin-top: 0.5rem;">${tags.map(tag => `<span style="background: ${getTagColor(tag)}; color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-right: 0.5rem;">${tag}</span>`).join('')}</div>` : ''}
                    </div>
                </div>
                <div class="image-meta">Last changed ${lastChanged}</div>
                <div class="image-tag">${img.tag_count} ${img.tag_count === 1 ? 'tag' : 'tags'} available</div>
            </div>
        `;
    }).join('');
}

function getTagColor(tag) {
    const colors = {
        'ubuntu': '#E95420',
        'alpine': '#0D597F',
        'redhat': '#EE0000',
        'debian': '#A80030',
        'centos': '#262577',
        'python': '#3776AB',
        'java': '#007396',
        'nodejs': '#339933',
        'go': '#00ADD8',
        'rust': '#000000',
        'prometheus': '#E6522C',
        'tenable': '#00B388',
        'nessus': '#00B388',
        'oracle': '#F80000'
    };
    return colors[tag] || '#334155';
}

function getImageTags(name) {
    const nameLower = name.toLowerCase();
    const tags = [];
    
    // Check for vendor/security tools first
    if (nameLower.includes('tenable')) {
        tags.push('tenable');
    }
    if (nameLower.includes('nessus')) {
        tags.push('nessus');
    }
    
    // Check for OS
    if (nameLower.includes('ubuntu') || nameLower.includes('ub20') || nameLower.includes('ub22') || nameLower.includes('ub24') || nameLower.includes('_ub') || nameLower.endsWith('ub')) {
        tags.push('ubuntu');
    } else if (nameLower.includes('alpine')) {
        tags.push('alpine');
    } else if (nameLower.includes('ubi') || nameLower.includes('redhat')) {
        tags.push('redhat');
    } else if (nameLower.includes('debian')) {
        tags.push('debian');
    } else if (nameLower.includes('centos')) {
        tags.push('centos');
    } else if (nameLower.includes('oracle')) {
        tags.push('oracle');
    }
    
    // Check for languages
    if (nameLower.includes('python') || nameLower.includes('py3') || nameLower.includes('py2')) {
        tags.push('python');
    }
    if (nameLower.includes('java')) {
        tags.push('java');
    }
    if (nameLower.includes('node') || nameLower.includes('nodejs')) {
        tags.push('nodejs');
    }
    if (nameLower.includes('go') || nameLower.includes('golang')) {
        tags.push('go');
    }
    if (nameLower.includes('rust')) {
        tags.push('rust');
    }
    if (nameLower.includes('prometheus') || nameLower.includes('prom')) {
        tags.push('prometheus');
    }
    
    return tags;
}

function getImageIcons(name) {
    const iconMap = {
        'python': '🐍',
        'py': '🐍',
        'node': '🟢',
        'nodejs': '🟢',
        'java': '☕',
        'go': '🔵',
        'golang': '🔵',
        'rust': '🦀',
        'alpine': '🏔️',
        'ubuntu': '<span class="ubuntu-icon"><span></span><span></span></span>',
        'ub20': '<span class="ubuntu-icon"><span></span><span></span></span>',
        'ub22': '<span class="ubuntu-icon"><span></span><span></span></span>',
        'ub24': '<span class="ubuntu-icon"><span></span><span></span></span>',
        'ubi': '🔴',
        'redhat': '🔴',
        'debian': '🔵',
        'centos': '💜'
    };
    
    const nameLower = name.toLowerCase();
    const foundIcons = [];
    
    // Check for each component in the image name
    for (const [key, icon] of Object.entries(iconMap)) {
        if (nameLower.includes(key)) {
            if (!foundIcons.includes(icon)) {
                foundIcons.push(icon);
            }
        }
    }
    
    // Return multiple icons or default
    return foundIcons.length > 0 ? foundIcons.join(' ') : '📦';
}

function filterImages() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allImages.filter(img => {
        const tags = getImageTags(img.name);
        return img.name.toLowerCase().includes(searchTerm) ||
               tags.some(tag => tag.toLowerCase().includes(searchTerm));
    });
    displayImages(filtered);
}

function viewImageDetails(imageName) {
    // Navigate to tags page for the image
    window.location.href = `/image/${imageName}/tags`;
}

// Load images on page load
document.addEventListener('DOMContentLoaded', loadCertifiedImages);
</script>
{% endblock %}
